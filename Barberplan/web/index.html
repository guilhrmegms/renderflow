<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberPlan — Agenda da Barbearia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==================== CABEÇALHO ==================== -->
    <header class="cabecalho">
        <div class="logo">
            <span class="logo-icone">&#9986;&#65039;</span>
            <div class="logo-texto">
                <h1>BARBERPLAN</h1>
                <p>Sistema de agendamento</p>
            </div>
        </div>

        <nav class="abas">
            <button class="aba ativa" data-aba="agenda">Agenda</button>
            <button class="aba" data-aba="novo">Novo agendamento</button>
            <button class="aba" data-aba="servicos">Serviços</button>
        </nav>
    </header>

    <main class="conteudo">

        <!-- ==================== ABA: AGENDA ==================== -->
        <section id="painel-agenda" class="painel ativo">

            <div class="painel-cabecalho">
                <h2>Agenda</h2>
                <p class="subtitulo">Agendamentos ordenados por data e horário</p>
            </div>

            <div class="filtros">
                <label for="filtro-data">Filtrar por data</label>
                <div class="filtros-linha">
                    <input type="date" id="filtro-data">
                    <button type="button" id="btn-filtrar" class="botao botao-destaque">Filtrar</button>
                    <button type="button" id="btn-limpar" class="botao botao-secundario">Limpar</button>
                </div>
            </div>

            <div id="lista-agendamentos" class="lista-cards">
                <!-- Os cards são montados pelo JavaScript -->
            </div>
        </section>

        <!-- ==================== ABA: NOVO ==================== -->
        <section id="painel-novo" class="painel">

            <div class="painel-cabecalho">
                <h2>Novo agendamento</h2>
                <p class="subtitulo">Preencha os dados do cliente</p>
            </div>

            <form id="form-agendamento" class="formulario" novalidate>

                <div id="mensagem-form" class="mensagem oculto"></div>

                <div class="campo">
                    <label for="nome">Nome do cliente *</label>
                    <input type="text" id="nome" placeholder="Ex.: João da Silva" autocomplete="off">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" placeholder="Ex.: (11) 99999-0000" autocomplete="off">
                </div>

                <div class="campo">
                    <label for="servico">Serviço *</label>
                    <select id="servico">
                        <option value="">Selecione um serviço</option>
                        <!-- Opções carregadas da API -->
                    </select>
                </div>

                <div class="campo duplo">
                    <div>
                        <label for="data">Data *</label>
                        <input type="date" id="data">
                    </div>
                    <div>
                        <label for="horario">Horário *</label>
                        <input type="time" id="horario" step="900">
                    </div>
                </div>

                <div class="acoes">
                    <button type="submit" class="botao botao-destaque">Salvar agendamento</button>
                    <button type="reset" class="botao botao-secundario">Limpar campos</button>
                </div>
            </form>
        </section>

        <!-- ==================== ABA: SERVIÇOS ==================== -->
        <section id="painel-servicos" class="painel">

            <div class="painel-cabecalho">
                <h2>Serviços</h2>
                <p class="subtitulo">Tabela de preços da barbearia</p>
            </div>

            <div id="lista-servicos" class="lista-cards">
                <!-- Os cards são montados pelo JavaScript -->
            </div>
        </section>

    </main>

    <footer class="rodape">
        <p>BarberPlan — projeto acadêmico de Java</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
